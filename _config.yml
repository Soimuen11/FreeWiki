title: The Free Wiki
tagline: "Linux Sysadmin, Terminal & FFmpeg Knowledge Base"
email: soimuen11@gmail.com
description: >-
  A curated, open-source knowledge base for Linux system administration, shell scripting, FFmpeg mastery, terminal diagnostics, and power-user workflows.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://freewiki.phiannetta.xyz" # the base hostname & protocol for your site, e.g. http://example.com
github_username: soimuen11
lang: en-US

# Author metadata for SEO & JSON-LD
